# Development CI: full tests and diagnostics; no MVP publication gate.
name: CI

# ai-review-ci dogfoods the same required test-ci workflow installed in downstream
# pull requests. Local test-commit and test-push remain hook boundaries; this
# workflow owns remote acceptance. The ambient debt audit remains separate.

on:
  push: {}

# Under a runner backlog, retain only the newest diagnostic snapshot for a
# branch. Running every superseded push would spend CI capacity on obsolete
# revisions and delay feedback for the actual current implementation.
concurrency:
  group: development-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc-ci:
    uses: ./.github/workflows/_qc.yml
    permissions:
      contents: read
      # Granted through to _qc.yml, whose suite reads labels via gh (issue-scoped).
      issues: read
    with:
      tier: test-ci
      profile: python
  sage-syntax-boundary:
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ github.token }}
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check real Sage syntax gates
        run: uv run --no-project --python 3.14 --with pytest==9.1.1 python -m pytest -q tests/test_sage_local_check.py -m sage_boundary

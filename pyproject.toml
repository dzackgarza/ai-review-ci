[project]
name = "ai-review-ci"
version = "0.1.0"
description = "Deterministic QC and branch protection installation"
requires-python = ">=3.14"
dependencies = [
    "automated-reviews",
    "cyclopts",
    "pydantic>=2",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "unidiff>=0.7.5",
]

[project.scripts]
ai-review-ci = "ai_review_ci.cli:main"

[dependency-groups]
dev = [
    "PyYAML",
    "types-PyYAML",
    "types-unidiff>=0.7.0.20260518",
    "websocket-client>=1.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gh_boundary: real GitHub API boundary tests; need GH_TOKEN, deselected by default (#218)",
]
addopts = ["-m", "not gh_boundary"]

[tool.importlinter]
root_packages = ["ai_review_ci"]
include_external_packages = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_review_ci"]

[tool.hatch.build.targets.wheel.force-include]
".github/workflows/_acceptance.yml" = "ai_review_ci/reusable_workflows/_acceptance.yml"
".github/workflows/_gates.yml" = "ai_review_ci/reusable_workflows/_gates.yml"
".github/workflows/_qc.yml" = "ai_review_ci/reusable_workflows/_qc.yml"

[tool.uv.sources]
automated-reviews = { git = "https://github.com/dzackgarza/automated-reviews.git", rev = "main" }

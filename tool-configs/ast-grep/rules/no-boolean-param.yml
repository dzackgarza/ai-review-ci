id: no-boolean-param
language: python
rule:
  any:
    - pattern:
        context: 'def f($P: bool): pass'
        selector: typed_parameter
    - pattern:
        context: 'def f($P: builtins.bool): pass'
        selector: typed_parameter
    - pattern:
        context: 'def f($P: "bool"): pass'
        selector: typed_parameter
    - pattern:
        context: 'def f($P: bool = $D): pass'
        selector: typed_default_parameter
    - pattern:
        context: 'def f($P: builtins.bool = $D): pass'
        selector: typed_default_parameter
    - pattern:
        context: 'def f($P: "bool" = $D): pass'
        selector: typed_default_parameter
    - all:
        - any:
            - pattern: bool
            - pattern: builtins.bool
            - pattern: '"bool"'
        - inside:
            kind: binary_operator
        - inside:
            any:
              - kind: typed_parameter
              - kind: typed_default_parameter
            field: type
            stopBy: end
        - not:
            inside:
              not:
                any:
                  - kind: binary_operator
                  - kind: parenthesized_expression
                  - kind: type
                  - kind: typed_parameter
                  - kind: typed_default_parameter
              stopBy:
                any:
                  - kind: typed_parameter
                  - kind: typed_default_parameter
    - pattern:
        context: 'def f($P = True): pass'
        selector: default_parameter
    - pattern:
        context: 'def f($P = False): pass'
        selector: default_parameter
    - pattern:
        context: 'def f($P: $T = True): pass'
        selector: typed_default_parameter
    - pattern:
        context: 'def f($P: $T = False): pass'
        selector: typed_default_parameter
message: POLICY.NO_BOOLEAN_MODE
severity: error
metadata:
  policy_code: POLICY.NO_BOOLEAN_MODE

# Global Mypy Configuration
[mypy]
python_version = 3.14
mypy_path = typings
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
# Sage-tier projects preparse .sage files, which injects
# `from sage.all_cmdline import *`; a star import from a missing module yields
# no names, so every sage.all name would report name-defined. The preamble also
# injects its whole API into the global namespace at load time (invisible to
# mypy). Both families are false positives in Sage research code; keep the
# checker's other guarantees (attr-defined, return-value, ...) while dropping
# name-defined globally. NOTE: this config is shared by all projects, so
# name-defined is off for Python-only projects too; a typo/NameError-class bug
# in non-Sage code will no longer be caught by mypy on this stack.
disable_error_code = name-defined

[mypy-slop_detector.*]
ignore_missing_imports = True

# SageMath ships no type stubs and is never installed in the uvx mypy
# environment, so sage.* imports can only resolve to "missing" in Sage-tier
# projects (justfiles/sage.just reuses this config).
[mypy-sage.*]
ignore_missing_imports = True

# fpylll (lattice-reduction backend used from Sage) also ships no stubs.
[mypy-fpylll.*]
ignore_missing_imports = True

# Tree-sitter grammar distributions ship their C-extension binding module
# in a generated bindings/ tree that QC excludes, and editable-hook
# installs are invisible to mypy's static import resolution.
[mypy-tree_sitter_sage.*]
ignore_missing_imports = True

# Build-time packaging imports in a setup.py (C-extension projects still
# need one); stubs are not installed in the uvx mypy environment.
[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-wheel.*]
ignore_missing_imports = True

# Test modules import pytest, which is not installed in the uvx mypy
# environment (mypy runs with the project editable only).
[mypy-pytest.*]
ignore_missing_imports = True

# flowmark's markdown layer subclasses marko's block elements, which requires one
# deliberately LSP-incompatible override: CustomFencedCode.parse returns an extended
# tuple (fence char/len) because marko passes parse()'s return straight to __init__,
# which has no other channel for that data. It is documented and already carries a
# reportIncompatibleMethodOverride pyright suppression; disable only the `override`
# code for this module so the rest of its (compatible) overrides stay checked.
[mypy-flowmark.formats.flowmark_markdown]
disable_error_code = override

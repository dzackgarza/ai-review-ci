# QC vendor/external directory exclusions — single source of truth.
#
# Directories listed here contain third-party, generated, vendored, or
# user-authored exploratory code that must never be linted, type-checked,
# scanned, formatted, or analyzed by generic QC.
#
# UNION of all excepted directories across:
#   - justfile-python     _python-qc-files   (-g '!**/dir/**')
#   - justfile-bun        _qc-excludes       (rg --files exclusions)
#   - justfile-rust       _rust-qc-files     (find -not -path)
#   - justfile-sage       _sage-qc-files     (-g '!**/dir/**')
#   - eslint.config.js                       (ignores)
#   - biome.json                             (files.includes negation)
#   - knip.json                              (ignore)
#   - .jscpd.json                            (ignore)
#   - slop-scan.config.json                  (ignores)
#   - pyright-local.json                     (exclude)
#
# Each tool config references this file as its single source of truth.
# Do NOT add tool-specific ignores here — add them in the tool's own config.

directories = [
    # Test-consumed data only. Fixtures are inputs whose byte-level or adversarial
    # form is part of their contract, and nothing outside the test suite reads
    # them, so normalizing them buys nothing and can invalidate the tests they
    # feed (#41 slop-torture, #219 ast-grep).
    "tests/fixtures",
    # Tree-sitter grammar fixtures: highlight/tags assertion files and
    # example corpora are parser inputs whose byte-level form (including
    # deliberately non-current-Python syntax) is the contract; the grammar's
    # own test harness owns them, generic Python QC must never touch them.
    "test/highlight",
    "test/tags",
    "examples",
    # Tree-sitter CLI-generated FFI bindings (node/python/rust/swift/go):
    # regenerated wholesale by `tree-sitter init --update`; hand-edits
    # diverge from the generator and are overwritten.
    "bindings",
    "node_modules",
    ".venv",
    ".pytest_cache",
    ".import_linter_cache",
    "__pycache__",
    "dist",
    "build",
    "coverage",
    "_ci-support",
    # Developer-only tooling (lint/benchmark scripts), never shipped in the wheel
    # and free to depend on untyped helper libs; not held to product QC.
    "devtools",
    "codeql-db",
    "tool-artifacts/models",
    "@girs",
    "__stubs__",
    "external",
    "target",
    "*.bak",
    ".git",
    ".next",
    ".lake",
    ".worktrees",
    # Agent-harness worktree checkouts: sibling branches live here and carry
    # their own QC runs; this repo must never lint another branch's worktree.
    ".claude/worktrees",
    # Agent-memory vault symlinks: point outside the project into the central
    # memory vault and must not be scanned by generic QC.
    ".agents",
    ".hermes",
    "vendor",
    "third_party",
    "venv",
    # Archived source trees are preserved reference material, not active code.
    "archives",
    "src.bak",
    # Research scripts and notebooks are user-authored exploratory artifacts,
    # not QC-owned product code. Knip alone keeps project scripts visible
    # because JS build and task scripts own dependency edges. (The research
    # preamble was once listed here; it is now the main codebase and is
    # QC-owned like any other package source.)
    "scripts",
    "notebooks",
    # Authored research notes and extraction dumps: prose whose rendered
    # content must never be altered by formatters (dzackgarza/research#187 —
    # flowmark is not render-neutral on them).
    "notes",
    ".webpack",
    "out",
    "release",
]

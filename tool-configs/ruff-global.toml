# Global Ruff Configuration (Strict)

# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Standard formatting
line-length = 176
indent-width = 4

# Target Python 3.14 (latest stable)
target-version = "py314"

[lint]
# Enable standard rules
select = ["E", "F", "I", "UP"]
# F401 (unused import) is off: its autofix deletes re-exports and registration imports.
# The commit gate fixes the working tree without restaging, so on 2026-09-25 it stripped
# ~435 import lines from research's preamble re-export surface (preamble/all.py and 36
# other modules) as uncommitted residue a later commit would have landed.
ignore = ["E741", "UP049", "F401"]

# Enforce strictness: fix everything
fixable = ["ALL"]
unfixable = ["SIM401", "PERF102"]
